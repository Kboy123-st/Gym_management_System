// BAD: Vulnerable to SQL Injection!
$user = $_POST['username'];
$pass = $_POST['password'];

$sql = "SELECT * FROM users 
        WHERE username = '$user' 
        AND password = '$pass'";

// Attacker enters:
// username: admin' OR '1'='1
// Resulting query logs them in as admin!</pre>
              <p class="text-[11px] text-red-700 mt-2 leading-relaxed">

// GOOD: Safe against SQL Injection!

  SELECT id, password_hash, role 
  FROM users 
  WHERE username = :u LIMIT 1
");

$stmt->execute([':u' => $username]);
$user = $stmt->fetch();

if ($user && password_verify($pass, $user['password_hash'])) {
  session_regenerate_id(true);
  // Logged in securely
}</pre>

define('DB_HOST', '127.0.0.1');
define('DB_NAME', 'gym_management_db');
define('DB_USER', 'root');
define('DB_PASS', '');

class Database {
  private static ?PDO $instance = null;

  public static function getConnection(): PDO {
    if (self::$instance === null) {
      $dsn = "mysql:host=" . DB_HOST . ";dbname=" . DB_NAME . ";charset=utf8mb4";
      $options = [
        PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
        PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
        // Anti-SQLi: Disable emulated prepared statements
        PDO::ATTR_EMULATE_PREPARES => false,
      ];
      try {
        self::$instance = new PDO($dsn, DB_USER, DB_PASS, $options);
      } catch (PDOException $e) {
        error_log("Connection failed: " . $e->getMessage());
        die(json_encode(["error" => "Database connection error"]));
      }
    }
    return self::$instance;
  }
}
?&gt;</pre>

session_start();
header('Content-Type: application/json');
require_once '../config/database.php';

$input = json_decode(file_get_contents('php://input'), true) ?: $_POST;
$username = trim($input['username'] ?? '');
$password = trim($input['password'] ?? '');

if (!$username || !$password) {
  http_response_code(400);
  die(json_encode(["error" => "Username and password required."]));
}

$pdo = Database::getConnection();
// Prepared query
$stmt = $pdo->prepare("SELECT * FROM users WHERE username = :u LIMIT 1");
$stmt->execute([':u' => $username]);
$user = $stmt->fetch();

if ($user && password_verify($password, $user['password_hash'])) {
  session_regenerate_id(true); // Session fixation defense
  $_SESSION['user_id'] = $user['id'];
  $_SESSION['role'] = $user['role'];
  unset($user['password_hash']);
  echo json_encode(["status" => "success", "user" => $user]);
} else {
  http_response_code(401);
  echo json_encode(["error" => "Invalid credentials."]);
}

session_start();
header('Content-Type: application/json');
require_once '../config/database.php';

if (!isset($_SESSION['user_id'])) {
  http_response_code(401);
  die(json_encode(["error" => "Unauthorized"]));
}

$pdo = Database::getConnection();
$method = $_SERVER['REQUEST_METHOD'];

if ($method === 'GET') {
  $search = trim($_GET['search'] ?? '');
  if ($search !== '') {
    // Safe parameterized search with wildcards
    $stmt = $pdo->prepare("SELECT * FROM members WHERE full_name LIKE :s OR member_code LIKE :s ORDER BY registration_date DESC");
    $stmt->execute([':s' => "%$search%"]);
  } else {
    $stmt = $pdo->query("SELECT * FROM members ORDER BY registration_date DESC");
  }
  echo json_encode(["data" => $stmt->fetchAll()]);
}

if ($method === 'POST') {
  if (!in_array($_SESSION['role'], ['admin', 'receptionist'])) {
    http_response_code(403);
    die(json_encode(["error" => "Permission denied"]));
  }
  $fullName = htmlspecialchars(trim($_POST['fullName'] ?? ''), ENT_QUOTES, 'UTF-8');
  $phone = trim($_POST['phone'] ?? '');
  $code = 'MEM-' . rand(1000, 9999);

  $stmt = $pdo->prepare("INSERT INTO members (id, member_code, full_name, phone, registration_date) VALUES (UUID(), :c, :n, :p, CURDATE())");
  $stmt->execute([':c' => $code, ':n' => $fullName, ':p' => $phone]);
  echo json_encode(["status" => "success", "member_code" => $code]);
}

-- 3rd Normal Form MySQL Database Schema
CREATE DATABASE IF NOT EXISTS gym_management_db;
USE gym_management_db;

CREATE TABLE users (
  id VARCHAR(36) PRIMARY KEY,
  username VARCHAR(50) NOT NULL UNIQUE,
  password_hash VARCHAR(255) NOT NULL,
  role ENUM('admin','receptionist','trainer') NOT NULL,
  name VARCHAR(100) NOT NULL,
  created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
) ENGINE=InnoDB;

CREATE TABLE trainers (
  id VARCHAR(36) PRIMARY KEY,
  trainer_code VARCHAR(20) NOT NULL UNIQUE,
  name VARCHAR(100) NOT NULL,
  phone VARCHAR(30) NOT NULL,
  specialty VARCHAR(100) NOT NULL,
  salary DECIMAL(10,2) NOT NULL DEFAULT 0.00
) ENGINE=InnoDB;

CREATE TABLE members (
  id VARCHAR(36) PRIMARY KEY,
  member_code VARCHAR(20) NOT NULL UNIQUE,
  full_name VARCHAR(100) NOT NULL,
  gender ENUM('Male','Female','Other') NOT NULL,
  phone VARCHAR(30) NOT NULL,
  trainer_id VARCHAR(36) NULL,
  registration_date DATE NOT NULL,
  FOREIGN KEY (trainer_id) REFERENCES trainers(id) ON DELETE SET NULL
) ENGINE=InnoDB;

CREATE TABLE plans (
  id VARCHAR(36) PRIMARY KEY,
  name VARCHAR(80) NOT NULL,
  duration_days INT UNSIGNED NOT NULL,
  price DECIMAL(10,2) NOT NULL
) ENGINE=InnoDB;

CREATE TABLE memberships (
  id VARCHAR(36) PRIMARY KEY,
  member_id VARCHAR(36) NOT NULL,
  plan_id VARCHAR(36) NOT NULL,
  start_date DATE NOT NULL,
  end_date DATE NOT NULL,
  status ENUM('Active','Expired','Frozen','Cancelled') NOT NULL DEFAULT 'Active',
  FOREIGN KEY (member_id) REFERENCES members(id) ON DELETE CASCADE,
  FOREIGN KEY (plan_id) REFERENCES plans(id) ON DELETE RESTRICT
) ENGINE=InnoDB;

CREATE TABLE attendance (
  id VARCHAR(36) PRIMARY KEY,
  member_id VARCHAR(36) NOT NULL,
  session_date DATE NOT NULL,
  check_in TIME NOT NULL,
  check_out TIME NULL,
  method ENUM('QR Code','Manual') DEFAULT 'Manual',
  FOREIGN KEY (member_id) REFERENCES members(id) ON DELETE CASCADE
) ENGINE=InnoDB;

CREATE TABLE payments (
  id VARCHAR(36) PRIMARY KEY,
  invoice_no VARCHAR(30) NOT NULL UNIQUE,
  member_id VARCHAR(36) NOT NULL,
  amount DECIMAL(10,2) NOT NULL,
  payment_date DATE NOT NULL,
  status ENUM('Paid','Pending') DEFAULT 'Paid',
  FOREIGN KEY (member_id) REFERENCES members(id) ON DELETE CASCADE
) ENGINE=InnoDB;

CREATE INDEX idx_members_code ON members(member_code);
CREATE INDEX idx_memberships_dates ON memberships(status, end_date);
CREATE INDEX idx_attendance_date ON attendance(session_date);</pre>
