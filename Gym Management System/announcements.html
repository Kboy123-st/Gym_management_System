<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron & Lime — Announcements</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app-shell"></div>

  <template id="announcements-tpl">
    <div class="space-y-4">
      <div class="card p-4 flex justify-between items-center">
        <div>
          <h2 class="font-display text-xl font-bold text-[var(--ink)]">Gym Notice Board</h2>
          <p class="text-xs text-[var(--muted)]">Broadcast notifications to staff, trainers, and notice screens</p>
        </div>
        <button id="btn-add-ann" class="btn btn-primary flex-shrink-0">+ Post Announcement</button>
      </div>

      <div id="ann-list" class="space-y-3"></div>
    </div>
  </template>

  <script src="js/common.js"></script>  <script>
    const outlet = renderChrome('announcements', 'Announcements & Notices');
    outlet.innerHTML = document.getElementById('announcements-tpl').innerHTML;

    function renderAnnouncements(){
      const list = DB.get('announcements', []);
      const host = document.getElementById('ann-list');

      if (!list.length){
        host.innerHTML = '<div class="card p-8 text-center text-xs text-[var(--muted)]">No active announcements.</div>';
        return;
      }

      host.innerHTML = list.map(a => `
        <div class="card p-5 flex flex-col md:flex-row justify-between items-start gap-4">
          <div class="space-y-1.5 flex-1">
            <div class="flex items-center gap-2">
              <span class="badge badge-info text-[10px]">${escapeHtml(a.category)}</span>
              <span class="text-xs text-[var(--muted)]">${fmtDate(a.date)} • by ${escapeHtml(a.author || 'Admin')}</span>
            </div>
            <h3 class="font-display text-2xl font-bold text-[var(--ink)]">${escapeHtml(a.title)}</h3>
            <p class="text-xs text-[var(--ink-soft)] leading-relaxed">${escapeHtml(a.body)}</p>
          </div>
          <button onclick="deleteAnnouncement('${a.id}')" class="btn btn-danger btn-sm text-xs flex-shrink-0">Delete</button>
        </div>
      `).join('');
    }

    function showAnnModal(){
      const u = Auth.currentUser();
      const html = `
        <form id="form-ann" class="p-6 space-y-4">
          <div class="flex items-center justify-between border-b border-[var(--line)] pb-3">
            <h3 class="font-display text-2xl font-bold text-[var(--ink)]">Post New Notice</h3>
            <button type="button" onclick="closeModal()" class="text-2xl text-[var(--muted)]">&times;</button>
          </div>

          <div>
            <label class="field-label">Notice Title *</label>
            <input name="title" class="input" required placeholder="e.g. Holiday Opening Hours">
          </div>

          <div>
            <label class="field-label">Category</label>
            <select name="category" class="input">
              <option value="Gym Events">Gym Events</option>
              <option value="Maintenance Notifications">Maintenance Notifications</option>
              <option value="Holiday Notices">Holiday Notices</option>
              <option value="Class Updates">Class Updates</option>
            </select>
          </div>

          <div>
            <label class="field-label">Announcement Content *</label>
            <textarea name="body" class="input" rows="4" required placeholder="Detailed message for members and staff..."></textarea>
          </div>

          <div class="flex justify-end gap-2 pt-3 border-t border-[var(--line)]">
            <button type="button" onclick="closeModal()" class="btn btn-outline">Cancel</button>
            <button type="submit" class="btn btn-primary">Publish</button>
          </div>
        </form>
      `;
      openModal(html);

      document.getElementById('form-ann').addEventListener('submit', function(e){
        e.preventDefault();
        const fd = new FormData(this);
        const all = DB.get('announcements', []);
        all.unshift({
          id: uid('AN'),
          title: fd.get('title').trim(),
          category: fd.get('category'),
          body: fd.get('body').trim(),
          date: todayISO(),
          author: u ? u.name : 'Admin'
        });
        DB.set('announcements', all);
        toast('Announcement posted', 'success');
        closeModal();
        renderAnnouncements();
      });
    }

    function deleteAnnouncement(id){
      if (!confirm('Remove this announcement?')) return;
      const all = DB.get('announcements', []).filter(x => x.id !== id);
      DB.set('announcements', all);
      renderAnnouncements();
    }

    document.getElementById('btn-add-ann').addEventListener('click', showAnnModal);
    renderAnnouncements();
  </script>
</body>
</html>
